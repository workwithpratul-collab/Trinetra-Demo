<svg xmlns="http://www.w3.org/2000/svg" viewBox="10 40 384 364" role="img" aria-label="Trinetra Creations logo mark">
  <!--
    Trinetra Creations: eye-and-T mark (white). Version 2.

    Drawing rules used in v2 (to stay crisp at small sizes):
    - Every stroke is a filled outline built from smooth C (curve) segments.
    - No stroke body is thinner than ~18 units, so at a 40px-tall logo
      each stroke is still about 2 screen pixels wide (no grey smear).
    - The viewBox is trimmed to the drawing, so no space is wasted.
  -->
  <g fill="#ffffff">
    <!-- Eyelids: upper arc + lower stroke meeting in a point on the left.
         Order: outer edge of upper lid → right tip → inner edge back to the
         inner corner → top edge of lower lid → its tip → bottom edge home. -->
    <path d="M18,150
             C78,60 268,6 384,100
             C276,58 112,86 58,150
             C96,190 146,206 196,206
             C140,232 66,214 18,150 Z"/>

    <!-- Pupil: solid oval with a slight tilt -->
    <ellipse cx="214" cy="134" rx="30" ry="36" transform="rotate(-8 214 134)"/>

    <!-- Crossbar of the T ("raised arms"): tapers in on the left,
         full weight on the right with a rounded end -->
    <path d="M146,160
             C168,196 196,206 222,204
             C262,200 290,178 306,146
             C312,134 330,138 330,152
             C318,190 278,226 222,228
             C186,230 156,206 146,160 Z"/>

    <!-- Stem of the T: starts hidden inside the crossbar, curves gently,
         tapers to a point at the bottom -->
    <path d="M208,210
             C212,280 208,340 194,394
             C222,340 238,280 236,210 Z"/>
  </g>
</svg>
